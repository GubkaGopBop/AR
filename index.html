<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef3f8">
  <title>Офисное кресло в дополненной реальности</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="overlay">
    <div id="aim" aria-hidden="true" hidden></div>
    <section id="intro" class="card">
      <h1>Офисное кресло</h1>
      <p id="support">Проверяем AR…</p>
      <button id="start" disabled>Начать AR</button>
      <button id="preview" class="secondary">Посмотреть кресло</button>
    </section>
    <section id="hud" class="card" hidden>
      <p id="status" role="status" aria-live="polite"></p>
      <div class="actions"><button id="place" disabled>Поставить кресло</button><button id="reset" class="secondary" hidden>Разместить заново</button><button id="exit" class="secondary">Выйти</button></div>
    </section>
    <p id="error" role="alert" hidden></p>
  </main>
  <script type="module">
    import('./app.js').catch(error => {
      document.querySelector('#support').textContent = 'Не удалось загрузить 3D-сцену. Обновите страницу в современном браузере.';
      document.querySelector('#error').hidden = false;
      document.querySelector('#error').textContent = error.message;
    });
  </script>
</body>
</html>
